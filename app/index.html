<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quaestor — the routing layer for trading agents</title>
    <meta
      name="description"
      content="Route risk, policy, settlement, and public proof through one governed layer for trading agents. Explore live decisions across X Layer, Arc, Base, and Hedera."
    />
    <meta name="theme-color" content="#0d0d0d" />

    <!--
      Without these, every link to this site renders as a bare grey box on X,
      Slack and Discord. og:image must be an absolute URL — crawlers do not
      resolve relative paths — and X will not fetch an SVG, which is why
      scripts/make-og.js emits a PNG.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quaestor" />
    <meta property="og:url" content="https://quaestor-app.onrender.com/" />
    <meta property="og:title" content="Quaestor — the routing layer for trading agents" />
    <meta
      property="og:description"
      content="One governed route for risk, policy, settlement, and public proof. Explore live agent decisions across four network roles."
    />
    <meta property="og:image" content="https://quaestor-app.onrender.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Quaestor — layered gold budget lines on black" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quaestor — the routing layer for trading agents" />
    <meta
      name="twitter:description"
      content="One governed route for risk, policy, settlement, and public proof. Explore live agent decisions across four network roles."
    />

    />

    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
