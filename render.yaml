# Render blueprint for the Quaestor stack (DIVIJ's Workspace).
# quaestor-app — the landing page + dashboard (static)
# quaestor-hub — oracle + decision ledger + hub + lanes + Cato on Base mainnet (node)
# quaestor-stocks — the Solana stocks lane alone: governor, price gate, MCP, paid tools (node)
# Pushes do not deploy these services; a deploy is triggered from the dashboard or the API.
services:
  - type: web
    name: quaestor-hub
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npx ts-node services/main.ts
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TS_NODE_TRANSPILE_ONLY   # types are checked in CI; boot in seconds on the free tier
        value: "1"
      - key: PORT
        value: "8402"
      # Base mainnet: the V2 governor, Cato trading USDC on Uniswap v3, and every
      # settled decision published to QuaestorLog. Agent reads and writes go to a
      # keyed endpoint: mainnet.base.org rate-limits per IP, and a free instance
      # shares its IP. Log reads go to a public endpoint of their own, because a
      # free Alchemy key serves receipts but only 10-block log ranges.
      - key: RPC_URL                   # e.g. an Alchemy Base URL; it carries the key
        sync: false
      - key: GOVERNOR_NETWORK
        value: eip155:8453
      - key: GOVERNOR_VERSION
        value: "2"
      - key: QUAESTOR_ADDRESS
        value: 0x2e91d035D622d2ECa36B7836CBcf9651711B2D10
      - key: QUAESTOR_ADDRESS_BASE     # the governor the subgraph indexes
        value: 0x2e91d035D622d2ECa36B7836CBcf9651711B2D10
      - key: QUAESTOR_LOG_ADDRESS
        value: 0x1219c62A56771CdCE7bb1f6e6a5ac05701DDF961
      - key: QUAESTOR_LOG_FROM_BLOCK
        value: "51604933"
      - key: QUAESTOR_LOG_RPC_URL
        value: https://base-rpc.publicnode.com
      - key: SUBGRAPH_URL
        value: https://api.studio.thegraph.com/query/1758977/quaestor/v0.2.0-base-mainnet
      - key: NATIVE_SYMBOL
        value: ETH
      # The signal is Uniswap's own quote, sold at a fixed ETH price.
      - key: ORACLE_SOURCE
        value: uniswap-v3
      - key: ORACLE_PRICE
        value: "0.000002"
      - key: ORACLE_SAMPLE_MS
        value: "60000"
      - key: ORACLE_COLLECTOR_ADDRESS
        sync: false
      - key: INFERENCE_SINK
        sync: false
      - key: INFERENCE_FEE
        value: "0.00001"
      - key: SELF_URL
        value: https://quaestor-hub.onrender.com
      - key: KEEPALIVE_URL
        value: https://quaestor-hub.onrender.com/healthz
      - key: ORACLE_URL
        value: http://localhost:8402
      - key: DECISION_LEDGER_URL
        value: http://localhost:8402
      - key: RUN_AGENT
        value: "1"
      - key: AGENT_ID
        value: "1"
      - key: AGENT_NAME
        value: Cato
      # The operator key only: it trades inside the caps and nothing else. The
      # owner key, which withdraws and rewrites caps, never leaves the owner's
      # machine.
      - key: OPERATOR_KEY
        sync: false
      - key: AGENT_INTERVAL_MS         # hourly: the treasury is real ETH
        value: "3600000"
      - key: AGENT_BASE_BUY
        value: "0.0001"
      - key: OPENROUTER_API_KEY
        sync: false
      # The explorer walks Base alone, slowly enough to leave the agent its budget.
      - key: EXPLORER_CHAINS
        value: base
      - key: EXPLORER_POLL_MS
        value: "15000"
      - key: EXPLORER_TX
        value: https://basescan.org/tx/
      # hub
      - key: TENANT_KEYS               # tenantId:sharedKey,... — one reporter per tenant
        sync: false
      - key: PERMIT_K
        value: "1"
      - key: PERMIT_BASE_HBAR
        value: "0.005"
      # lanes (off until their accounts are funded)
      - key: X402_ENABLED
        value: "0"
      - key: X402_HEDERA_ENABLED
        value: "0"
      # Attestcoin / Creditcoin cross-chain budget root. The relayer key is a
      # dedicated tCTC-funded key; it is not the root owner key.
      - key: ATTESTED_ADDRESS
        value: 0x2e91d035D622d2ECa36B7836CBcf9651711B2D10
      - key: ATTEST_SOURCE_GOVERNOR
        value: 0x34317a98d851c5b0d46e0e491be09cb956980bb3
      - key: ATTEST_WATCH_ENABLED
        value: "1"
      - key: ATTEST_FROM_BLOCK
        value: "11682846"
      - key: SOURCE_CHAIN_KEY
        value: "1"
      - key: SEPOLIA_RPC
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: CREDITCOIN_RPC
        value: https://rpc.cc3-testnet.creditcoin.network
      - key: PROOF_BUILDER_URL
        value: https://proof-gen-api.cc3-testnet.creditcoin.network
      - key: CREDITCOIN_PRIVATE_KEY
        sync: false

  - type: web
    name: quaestor-app
    runtime: static
    buildCommand: cd app && npm ci && npm run build
    staticPublishPath: ./app/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_STOCKS_API           # read at build time; without it the Stocks view looks for a local hub
        value: https://quaestor-stocks.onrender.com

  # The stocks lane as a process of its own (services/stocks-main.ts). It needs
  # none of the EVM secrets above, so it is not handed them.
  - type: web
    name: quaestor-stocks
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev   # ts-node is a dev dependency and the start command needs it
    startCommand: npx ts-node services/stocks-main.ts
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TS_NODE_TRANSPILE_ONLY   # transpile only, so the free tier boots in seconds; CI does not type-check, so run npx tsc --noEmit before a deploy
        value: "1"
      - key: SOLANA_STOCKS_ENABLED
        value: "1"
      - key: SOLANA_STOCKS_CLUSTER     # devnet: the hub signs and sends for real; unset, execution is off
        value: devnet
      - key: SOLANA_DEVNET_RPC_URL     # required for the devnet lane (the public endpoint throttles trades); also relays the explorer's devnet reads
        sync: false
      - key: SOLANA_STOCKS_TAKER       # address handed to Jupiter as the taker; required, or the lane does not mount
        sync: false
      - key: SOLANA_STOCK_OPERATOR_TOKEN   # 16+ characters, or the lane does not mount
        sync: false
      # Hosted caps, in USDC base units (6 decimals): 5 per trade, 25 per day.
      - key: SOLANA_STOCK_PER_TRADE_CAP
        value: "5000000"
      - key: SOLANA_STOCK_EPOCH_CAP
        value: "25000000"
      # Keypairs as JSON byte arrays. The fee payer is a dedicated low-value key:
      # the deployer is also the programs' upgrade authority and does not belong
      # on a host. The operator must match the one the deployed governor records.
      - key: DEVNET_PAYER_SECRET
        sync: false
      - key: DEVNET_OPERATOR_SECRET    # leave unset when DYNAMIC_OPERATOR=1: it is then never read
        sync: false
      - key: DEVNET_POOL_AUTHORITY_SECRET
        sync: false
      # The operator as a Dynamic two-of-two MPC wallet: this host holds one
      # share, Dynamic the other, and a signature takes both. Revoking the API
      # token at Dynamic ends this host's ability to sign without touching the
      # chain. DYNAMIC_OPERATOR_WALLET is the JSON importPrivateKey returned
      # ({walletMetadata, externalServerKeyShares}); its address must be the
      # operator the governor records, or the lane does not mount.
      - key: DYNAMIC_OPERATOR
        value: "1"
      - key: DYNAMIC_ENVIRONMENT_ID
        sync: false
      - key: DYNAMIC_AUTH_TOKEN
        sync: false
      - key: DYNAMIC_WALLET_PASSWORD
        sync: false
      - key: DYNAMIC_OPERATOR_WALLET
        sync: false
      # MCP over HTTP at /mcp. Without a key an agent gets the read-only tools
      # and no execute tool; the key (24+ characters) adds it.
      - key: STOCKS_MCP_ENABLED
        value: "1"
      - key: STOCKS_MCP_PUBLIC_READS
        value: "1"
      - key: STOCKS_MCP_API_KEY        # or STOCKS_MCP_API_KEYS=name:key,... to revoke one agent alone
        sync: false
      # Paid tools. INTEL_PROXY_KEY (24+ characters) is what the Bankr x402
      # handlers present to /internal/intel/*; unset, those routes are not mounted.
      - key: INTEL_ENABLED
        value: "1"
      - key: INTEL_PROXY_KEY
        sync: false
      # x402 on Solana, settled by PayAI. The charge is intel, not tape: the hub's
      # own MCP tools read the price tape over loopback, and a paywalled tape
      # would answer them 402.
      - key: X402_SOLANA_ENABLED
        value: "1"
      - key: X402_SOLANA_CHARGE
        value: intel
      - key: X402_SOLANA_PAY_TO        # receives USDC; its USDC account must already exist
        sync: false
      # Proxies in front of the process, exactly. Render was measured at 3. Too
      # few and every caller shares one rate-limit bucket; too many and a caller
      # picks their own address with a forged X-Forwarded-For. The first outside
      # request is logged so the number can be checked.
      - key: TRUST_PROXY_HOPS
        value: "3"
      # The price tape lives in memory; a free instance that sleeps wakes to a
      # gate that refuses until the tape refills.
      - key: KEEPALIVE_URL
        value: https://quaestor-stocks.onrender.com/healthz
