[workspace]
members = ["programs/*"]
# The lean build carries its own release profile, so it is its own workspace.
exclude = ["programs/quaestor-stocks-lite"]
resolver = "2"

[profile.release]
# Arithmetic on a vault balance must never wrap silently, so overflow checks
# stay on in the deployed artifact even though it costs a few compute units.
overflow-checks = true
lto = "fat"
codegen-units = 1
incremental = false
