[package]
name = "router-stub"
version = "0.1.0"
edition = "2021"
description = "Local-validator stand-in for a swap aggregator; never deployed to mainnet"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "router_stub"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
