specVersion: 1.3.0
description: >
  Quaestor's governor on Base Sepolia — the spend history an on-chain budget
  cannot afford to keep. Derives per-epoch and per-category rollups, spend
  velocity and suspension history from Receipt, PolicySet and Suspended events.
repository: https://github.com/N-45div/Quaestor
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Quaestor
    # NOTE: `network:` is not validated at build time — a typo only surfaces at
    # deploy. Copy this literally; the registry id is `base-sepolia`.
    network: base-sepolia
    source:
      address: "0x99D7fcf0153b1CB171F0de432D8aC159Abc63b24"
      abi: Quaestor
      startBlock: 46565163
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Agent
        - Policy
        - Receipt
        - EpochSpend
        - Suspension
        - Protocol
      abis:
        - name: Quaestor
          file: ./abis/Quaestor.json
      # graph-cli 0.98.1 validates these against `abi.eventSignatures()`, which
      # emits the `indexed ` prefix. The older bare form the docs still show is
      # rejected with "not present in ABI".
      eventHandlers:
        - event: AgentRegistered(indexed uint256,indexed address,address,uint32,string)
          handler: handleAgentRegistered
        - event: PolicySet(indexed uint256,indexed uint8,uint128,uint128)
          handler: handlePolicySet
        - event: Receipt(indexed uint256,indexed uint8,address,uint256,bytes32,uint256,uint256)
          handler: handleReceipt
        - event: Suspended(indexed uint256,address)
          handler: handleSuspended
        - event: Resumed(indexed uint256)
          handler: handleResumed
        - event: OperatorSet(indexed uint256,address)
          handler: handleOperatorSet
        - event: GuardianSet(indexed uint256,address)
          handler: handleGuardianSet
