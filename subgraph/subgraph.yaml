specVersion: 1.3.0
description: >
  Quaestor's governor on Base mainnet — the spend history an on-chain budget
  cannot afford to keep. Derives per-epoch and per-category rollups, spend
  velocity and suspension history from Receipt, PolicySet and Suspended events,
  and records which venues and instruments the owner allowed, and what each
  governed swap actually delivered.
repository: https://gitlab.com/ndivij2004/quaestor
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Quaestor
    # NOTE: `network:` is not validated at build time — a typo only surfaces at
    # deploy. Copy this literally; the registry id for Base mainnet is `base`.
    network: base
    source:
      address: "0x2e91d035D622d2ECa36B7836CBcf9651711B2D10"
      abi: QuaestorV2
      # The block QuaestorV2 first had code at, found by bisecting eth_getCode
      # rather than read from the deploy script's own output.
      startBlock: 51597021
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Agent
        - Policy
        - Receipt
        - EpochSpend
        - Suspension
        - Venue
        - Instrument
        - Swap
        - Protocol
      abis:
        - name: QuaestorV2
          file: ./abis/QuaestorV2.json
      # graph-cli 0.98.1 validates these against `abi.eventSignatures()`, which
      # emits the `indexed ` prefix. The older bare form the docs still show is
      # rejected with "not present in ABI".
      eventHandlers:
        - event: AgentRegistered(indexed uint256,indexed address,indexed address,uint32,string)
          handler: handleAgentRegistered
        - event: PolicySet(indexed uint256,indexed uint8,uint128,uint128)
          handler: handlePolicySet
        - event: Receipt(indexed uint256,indexed uint8,indexed address,uint256,bytes32,uint256,uint256)
          handler: handleReceipt
        - event: Suspended(indexed uint256,indexed address)
          handler: handleSuspended
        - event: Resumed(indexed uint256)
          handler: handleResumed
        - event: OperatorChanged(indexed uint256,indexed address)
          handler: handleOperatorChanged
        - event: GuardianChanged(indexed uint256,indexed address)
          handler: handleGuardianChanged
        - event: VenueAllowed(indexed uint256,indexed address,bool)
          handler: handleVenueAllowed
        - event: InstrumentAllowed(indexed uint256,indexed address,bool)
          handler: handleInstrumentAllowed
        - event: SwapExecuted(indexed uint256,indexed address,indexed address,uint256,uint256)
          handler: handleSwapExecuted
        - event: Deposited(indexed uint256,indexed address,uint256)
          handler: handleDeposited
        - event: Withdrawn(indexed uint256,indexed address,uint256)
          handler: handleWithdrawn
