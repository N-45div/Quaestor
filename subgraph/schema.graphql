# Quaestor subgraph — the governor's memory.
#
# Be precise about what the chain does and does not keep, because the easy
# version of this claim is wrong. `spentIn[agentId][category][epoch]` is a
# persistent mapping: the *total* for any epoch you can name stays readable
# on-chain forever. The governor does not forget its sums.
#
# What a sum cannot tell you is the SHAPE of the spend — the largest single
# payment, how many payments made up the total, whether they arrived over an
# hour or in one second. And because `spentIn` is a mapping, there is no way to
# enumerate which epoch indices are even non-empty: with a one-hour epoch and
# an agent registered in June, that is thousands of keys and no iterator.
#
# Those facts exist only in the event stream. These mappings are what turn them
# into something an agent can query about its own behaviour.
#
# Category is the Solidity enum `Category { DATA, INFERENCE, EXECUTION }`.
# Indexed enum params surface as plain i32, so it is `Int!` here, and the
# mappings also write a human label so an agent (or a judge) never has to
# remember that 1 means INFERENCE.

type Agent @entity(immutable: false) {
  "The agentId, as bytes."
  id: Bytes!
  agentId: BigInt!
  owner: Bytes!
  operator: Bytes!
  guardian: Bytes
  epochLength: BigInt!
  metadataURI: String!

  suspended: Boolean!
  registeredAt: BigInt!
  registeredBlock: BigInt!

  "Lifetime totals, derived — the chain stores none of these."
  totalSpent: BigInt!
  receiptCount: BigInt!
  suspensionCount: BigInt!
  lastReceiptAt: BigInt

  policies: [Policy!]! @derivedFrom(field: "agent")
  receipts: [Receipt!]! @derivedFrom(field: "agent")
  epochs: [EpochSpend!]! @derivedFrom(field: "agent")
  suspensions: [Suspension!]! @derivedFrom(field: "agent")
}

"The cap the owner set, per category. The last write wins, so this is current policy."
type Policy @entity(immutable: false) {
  "agentId-category"
  id: Bytes!
  agent: Agent!
  category: Int!
  categoryName: String!
  epochCap: BigInt!
  perCallCap: BigInt!
  updatedAt: BigInt!
  updatedBlock: BigInt!
}

"One authorized spend. Immutable: a receipt is a fact, it never changes."
type Receipt @entity(immutable: true) {
  "txHash-logIndex"
  id: Bytes!
  agent: Agent!
  category: Int!
  categoryName: String!
  payee: Bytes!
  amount: BigInt!
  "keccak256 of the off-chain decision record — the reason, bound to the payment."
  metaHash: Bytes!
  epoch: BigInt!
  epochSpentAfter: BigInt!

  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}

"""
Per-agent, per-category, per-epoch rollup.

`spent` mirrors what `spentIn` already holds on-chain — it is here so one query
answers the whole question, and so epochs can be *enumerated* rather than
guessed at. The fields the chain genuinely cannot produce are `receiptCount`,
`maxReceipt`, `firstAt` and `lastAt`: burst and frequency, which a running
total erases by construction.
"""
type EpochSpend @entity(immutable: false) {
  "agentId-category-epoch"
  id: Bytes!
  agent: Agent!
  category: Int!
  categoryName: String!
  epoch: BigInt!

  spent: BigInt!
  receiptCount: BigInt!
  "Largest single spend in this epoch — a burst signal a running total hides."
  maxReceipt: BigInt!
  firstAt: BigInt!
  lastAt: BigInt!
}

"A suspension by the guardian, and when (if ever) the owner resumed."
type Suspension @entity(immutable: false) {
  "txHash-logIndex"
  id: Bytes!
  agent: Agent!
  by: Bytes!
  at: BigInt!
  block: BigInt!
  transactionHash: Bytes!
  resumedAt: BigInt
}

"""
Protocol-wide counters, so a reader can tell an empty subgraph (nothing indexed
yet) from a genuinely quiet one (indexed, but no spends). Without this a
freshness gate cannot distinguish 'no data' from 'no activity'.
"""
type Protocol @entity(immutable: false) {
  "Always the single key 0x01."
  id: Bytes!
  agentCount: BigInt!
  receiptCount: BigInt!
  totalSpent: BigInt!
  lastReceiptAt: BigInt
  lastBlock: BigInt!
}
