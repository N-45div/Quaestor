# Quaestor subgraph — the governor's memory.
#
# Be precise about what the chain does and does not keep, because the easy
# version of this claim is wrong. `spentIn[agentId][category][epoch]` is a
# persistent mapping: the *total* for any epoch you can name stays readable
# on-chain forever. The governor does not forget its sums.
#
# What a sum cannot tell you is the SHAPE of the spend — the largest single
# payment, how many payments made up the total, whether they arrived over an
# hour or in one second. And because `spentIn` is a mapping, there is no way to
# enumerate which epoch indices are even non-empty: with a one-hour epoch and
# an agent registered in June, that is thousands of keys and no iterator.
#
# Those facts exist only in the event stream. These mappings are what turn them
# into something an agent can query about its own behaviour.
#
# Category is the Solidity enum `Category { DATA, INFERENCE, EXECUTION }`.
# Indexed enum params surface as plain i32, so it is `Int!` here, and the
# mappings also write a human label so an agent (or a judge) never has to
# remember that 1 means INFERENCE.

type Agent @entity(immutable: false) {
  "The agentId, as bytes."
  id: Bytes!
  agentId: BigInt!
  owner: Bytes!
  operator: Bytes!
  guardian: Bytes
  epochLength: BigInt!
  metadataURI: String!

  suspended: Boolean!
  registeredAt: BigInt!
  registeredBlock: BigInt!

  "Lifetime totals, derived — the chain stores none of these."
  totalSpent: BigInt!
  receiptCount: BigInt!
  suspensionCount: BigInt!
  lastReceiptAt: BigInt

  "What the treasury holds now, from deposits and withdrawals less what was spent."
  treasury: BigInt!
  swapCount: BigInt!

  policies: [Policy!]! @derivedFrom(field: "agent")
  receipts: [Receipt!]! @derivedFrom(field: "agent")
  epochs: [EpochSpend!]! @derivedFrom(field: "agent")
  suspensions: [Suspension!]! @derivedFrom(field: "agent")
  venues: [Venue!]! @derivedFrom(field: "agent")
  instruments: [Instrument!]! @derivedFrom(field: "agent")
  swaps: [Swap!]! @derivedFrom(field: "agent")
  treasuryMoves: [TreasuryMove!]! @derivedFrom(field: "agent")
}

"The cap the owner set, per category. The last write wins, so this is current policy."
type Policy @entity(immutable: false) {
  "agentId-category"
  id: Bytes!
  agent: Agent!
  category: Int!
  categoryName: String!
  epochCap: BigInt!
  perCallCap: BigInt!
  updatedAt: BigInt!
  updatedBlock: BigInt!
}

"One authorized spend. Immutable: a receipt is a fact, it never changes."
type Receipt @entity(immutable: true) {
  "txHash-logIndex"
  id: Bytes!
  agent: Agent!
  category: Int!
  categoryName: String!
  payee: Bytes!
  amount: BigInt!
  "keccak256 of the off-chain decision record — the reason, bound to the payment."
  metaHash: Bytes!
  "The record itself, once someone has published it to QuaestorLog. Null until then."
  decision: DecisionRecord
  epoch: BigInt!
  epochSpentAfter: BigInt!

  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}

"""
Per-agent, per-category, per-epoch rollup.

`spent` mirrors what `spentIn` already holds on-chain — it is here so one query
answers the whole question, and so epochs can be *enumerated* rather than
guessed at. The fields the chain genuinely cannot produce are `receiptCount`,
`maxReceipt`, `firstAt` and `lastAt`: burst and frequency, which a running
total erases by construction.
"""
type EpochSpend @entity(immutable: false) {
  "agentId-category-epoch"
  id: Bytes!
  agent: Agent!
  category: Int!
  categoryName: String!
  epoch: BigInt!

  spent: BigInt!
  receiptCount: BigInt!
  "Largest single spend in this epoch — a burst signal a running total hides."
  maxReceipt: BigInt!
  firstAt: BigInt!
  lastAt: BigInt!
}

"A suspension by the guardian, and when (if ever) the owner resumed."
type Suspension @entity(immutable: false) {
  "txHash-logIndex"
  id: Bytes!
  agent: Agent!
  by: Bytes!
  at: BigInt!
  block: BigInt!
  transactionHash: Bytes!
  resumedAt: BigInt
}

"""
Protocol-wide counters, so a reader can tell an empty subgraph (nothing indexed
yet) from a genuinely quiet one (indexed, but no spends). Without this a
freshness gate cannot distinguish 'no data' from 'no activity'.
"""
type Protocol @entity(immutable: false) {
  "Always the single key 0x01."
  id: Bytes!
  agentCount: BigInt!
  receiptCount: BigInt!
  totalSpent: BigInt!
  lastReceiptAt: BigInt
  lastBlock: BigInt!
}

"""
A venue the owner allowed this agent's funds to be sent to, and whether it still is.

The governor hands a venue calldata it never reads, so what makes a venue safe
is not the code here but that the owner put it on this list and can take it off
again. Both facts are events, so both are here, with the whole history.
"""
type Venue @entity(immutable: false) {
  "agentId-venue"
  id: Bytes!
  agent: Agent!
  venue: Bytes!
  allowed: Boolean!
  "Every time it was allowed or revoked, newest last."
  changeCount: BigInt!
  firstAllowedAt: BigInt!
  updatedAt: BigInt!
  updatedBlock: BigInt!
  "Swaps routed through it. Empty is a venue allowed and never used."
  swaps: [Swap!]! @derivedFrom(field: "venue")
}

"A token the owner allowed this agent to end up holding."
type Instrument @entity(immutable: false) {
  "agentId-token"
  id: Bytes!
  agent: Agent!
  token: Bytes!
  allowed: Boolean!
  changeCount: BigInt!
  firstAllowedAt: BigInt!
  updatedAt: BigInt!
  updatedBlock: BigInt!
  swaps: [Swap!]! @derivedFrom(field: "instrument")
}

"""
One governed swap that settled.

`amountOut` is what the contract measured arriving at the owner, not what the
venue said it would deliver, and `amountIn` is what actually left the treasury
rather than what was authorised. A swap that lied about either never got here:
it reverted, and a reverted transaction emits nothing.
"""
type Swap @entity(immutable: true) {
  "txHash-logIndex"
  id: Bytes!
  agent: Agent!
  venue: Venue!
  instrument: Instrument!
  amountIn: BigInt!
  amountOut: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}

"Money into or out of an agent's treasury. Only the owner can withdraw."
type TreasuryMove @entity(immutable: true) {
  "txHash-logIndex"
  id: Bytes!
  agent: Agent!
  direction: String!
  counterparty: Bytes!
  amount: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}

"""
The text behind a Receipt's metaHash, as published to QuaestorLog.

The id is the hash QuaestorLog computed from the bytes, never one a publisher
supplied, so a record found under a Receipt's metaHash is that record: anyone
can recompute keccak256(recordBytes) and compare. Who published it does not
matter, and is kept only as a fact.
"""
type DecisionRecord @entity(immutable: true) {
  "keccak256 of recordBytes, computed on chain"
  id: Bytes!
  "The record as UTF-8. Decision records are JSON."
  record: String!
  recordBytes: Bytes!
  publisher: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}

"""
A venue an agent was attacked through, as relayed to QuaestorLog.

The chain makes a report permanent and ordered. It does not make the reporter a
verified human: that was decided by the relayer, so a reader should count only
reports whose `reporter` is an address it trusts to have checked.
"""
type ThreatReport @entity(immutable: true) {
  "txHash-logIndex"
  id: Bytes!
  venue: String!
  venueHash: Bytes!
  pattern: String!
  "Zero when the reporter was not verified."
  humanId: Bytes!
  "keccak256 of the tenant's id: countable, not named."
  tenantHash: Bytes!
  reporter: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}
